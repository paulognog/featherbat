name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build featherbat.exe
        shell: msys2 {0}
        run: cmd.exe //c build.bat

      - name: Run unit tests
        shell: msys2 {0}
        run: |
          gcc -std=c11 -Os -nostdlib -ffreestanding -fno-asynchronous-unwind-tables -fno-unwind-tables \
            -fno-ident -ffunction-sections -mno-stack-arg-probe \
            -D_WIN32_WINNT=0x0A00 -DWINVER=0x0A00 -DUNICODE -D_UNICODE -Wall -Wextra \
            -mconsole -s -Wl,--gc-sections -Wl,-e,mainCRTStartup \
            tests/unit_test.c build/mini.o build/hid.o build/drv_logi.o build/drv_ps.o build/drv_kysona.o \
            -o build/unit_test.exe -lkernel32 -luser32 -lsetupapi -lcfgmgr32 -lhid
          ./build/unit_test.exe

      - name: Package release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item featherbat.exe dist/featherbat.exe
          Compress-Archive -Path `
            featherbat.exe, `
            testar-deteccao.bat, `
            testar-widget.bat, `
            parar-widget.bat, `
            gerar-dump.bat, `
            desinstalar.bat, `
            README.md, `
            LICENSE `
            -DestinationPath dist/featherbat-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: featherbat
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: featherbat
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
